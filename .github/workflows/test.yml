name: Tests
on:
  # PR commits run once through pull_request; push runs only for main.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A newer commit on the same PR cancels its in-progress run; main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Acceptance supervision preflight
        run: node --input-type=module -e "import {runCommands} from './scripts/acceptance.mjs'; const results=runCommands(process.cwd(),['node -p 1']); console.log(JSON.stringify(results)); if(results.some(r=>r.status!=='pass'))process.exit(1);"
      - name: Writable roots and resume smoke regressions
        run: node --test --test-concurrency=1 tests/sandbox-roots.test.mjs tests/smoke.test.mjs
      - name: Acceptance and agent guard regressions
        run: node --test --test-concurrency=1 tests/agent-guards.test.mjs
      - run: npm test
      - run: node scripts/generate-state-docs.mjs --check
