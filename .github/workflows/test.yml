name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Acceptance supervision preflight
        run: node --input-type=module -e "import {runCommands} from './scripts/acceptance.mjs'; const results=runCommands(process.cwd(),['node -p 1']); console.log(JSON.stringify(results)); if(results.some(r=>r.status!=='pass'))process.exit(1);"
      - run: npm test
      - run: node scripts/generate-state-docs.mjs --check
